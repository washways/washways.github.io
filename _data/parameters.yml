######################### Default Parameters ###########################

# logo
logo: "/assets/images/logo.svg"
# meta data
author: "WASHWays"
description: "Free online tools for water, sanitation and hygiene (WASH) planning, costing and monitoring."
# Google Analytics is loaded on every page by assets/js/washways-analytics.js (GA4 G-64GCB9QDB5 with a consent banner).
# Contact form: Formspree endpoint (messages go to the address on the Formspree account).
# If set to "#", the contact page shows the form greyed out with a "being set up" note.
contact_form_action: "https://formspree.io/f/xzerzokq"
# copyright
copyright: "Copyright &copy; 2024 [washways](https://washways.org) based on theme by [themfisher](https://themfisher.com)"

# preloader
preloader:
  enable: true
  preloader: "" # use png, jpg, svg or gif format

# search
search:
  enable: true

############################## Social Site ##########################
social:

  - name: "github"
    icon: "ti-github" # themify icon pack https://themify.me/themify-icons
    link: "https://github.com/washways/"


